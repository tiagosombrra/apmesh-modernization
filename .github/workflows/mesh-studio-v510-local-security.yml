name: Mesh Studio V5.10 / hardened local-source reviewer Linux and Windows

on:
  push:
    branches:
      - feature/mesh-studio-v510-loopback-security-review-20261123
    paths:
      - '.github/workflows/mesh-studio-v510-local-security.yml'
      - 'tools/mesh_studio/v59_reviewer.py'
      - 'tools/mesh_studio/test_v59_reviewer.py'
      - 'tools/mesh_studio/local_launcher.py'
      - 'tools/mesh_studio/local_loopback_guard.py'
      - 'tools/mesh_studio/test_v510_local_guard.py'
      - 'tools/mesh_studio/web/vite.config.ts'
      - 'tools/mesh_studio/web_api.py'
      - 'tools/mesh_studio/svg_figure.py'
      - 'tools/mesh_studio/test_v58_local_launcher.py'
      - 'tools/mesh_studio/web/playwright.config.ts'
      - 'tools/mesh_studio/web/tests/viewport-v59-original-reviewer.spec.ts'
      - 'tools/mesh_studio/web/package.json'
      - 'tools/mesh_studio/web/package-lock.json'
      - 'tools/mesh_studio/native_accepted_vector_publication.py'
      - 'tools/mesh_studio/native_accepted_scene.py'
      - 'tools/mesh_studio/verify_native_lineage.py'
      - 'tools/mesh_studio/locks/**'
      - 'tools/mesh_studio/dependency_lock_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mesh-studio-v510-secure-reviewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-original-reviewer:
    name: hardened-native-reviewer-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/mesh_studio/locks/requirements-web-ci-linux-py313.lock
            tools/mesh_studio/locks/requirements-web-ci-windows-py313.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mesh_studio/web/package-lock.json
      - name: Retrieve exact historical same-run C++-attested visual archive, never a local synthetic fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-v52-original-native-accepted-uv-vector-7d41ab8ec55b34bf879f9efc2a547168e50143de
          path: build/v59-native-reviewer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: 45147268663
      - name: Retrieve same-original-run independently retained genuine accepted C++ NDJSON, audits and stderr
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-r2712-native-original-source-7d41ab8ec55b34bf879f9efc2a547168e50143de
          path: build/v59-native-reviewer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: 45147268663
      - name: Audit original source hashes and rerun original postcommit native C++ independent per-face vectors
        run: python -m tools.mesh_studio.v59_reviewer preflight --receipt build/v59-source-audit.json
      - name: Run exact source lock and adversarial reviewer tests
        run: |
          python -m tools.mesh_studio.dependency_lock_audit
          python -m unittest tools.mesh_studio.test_v58_local_launcher tools.mesh_studio.test_v59_reviewer tools.mesh_studio.test_v510_local_guard -v
      - name: Install minimal Python 13-package API and source SHA-locked npm
        run: python -m tools.mesh_studio.local_launcher setup
      - name: Install Chromium on Windows without other source dependencies
        if: runner.os == 'Windows'
        working-directory: tools/mesh_studio/web
        run: npm exec playwright install chromium
      - name: Install Chromium and actual headless operating-system libraries
        if: runner.os == 'Linux'
        working-directory: tools/mesh_studio/web
        run: npm exec playwright install --with-deps chromium
      - name: Launch guarded V5.10 API and Vite, refuse hostile Host/Origin/fetch-site/writes, run original Book/Eistute reviewer and stop
        run: python -m tools.mesh_studio.v59_reviewer smoke --receipt build/v59-reviewer-audit.json
      - name: Verify negative request checks ran against actual HTTP listeners
        run: |
          echo 'V510_LOCAL_HOST_ORIGIN_SITE_WRITE_REJECTIONS=8'
          echo 'V510_TRUE_ORIGINAL_CPP_SOURCE_REOPENED=TRUE'
          echo 'V510_NATIVE_CPP_RECOMPILED=FALSE'
          echo 'V510_PRODUCTION_AUTHENTICATION=NOT_CLAIMED'
      - name: Independently require browser receipt and no orphaned loopback ports
        run: |
          python -m tools.mesh_studio.v59_reviewer preflight
          python -c "import json, pathlib, socket; p=pathlib.Path('tools/mesh_studio/web/test-results/v59-original-reviewer.json'); r=json.loads(p.read_text()); assert [x['model'] for x in r['native_models']]==['eistute','book']; assert [x['original_tri_faces'] for x in r['native_models']]==[1168,4256]; sockets=[socket.socket() for _ in range(2)]; codes=[s.connect_ex(('127.0.0.1',port)) for s,port in zip(sockets,(8765,5173))]; [s.close() for s in sockets]; assert all(c!=0 for c in codes), codes; print('V59_SOURCE_BROWSER_AND_NO_ORPHAN_PORTS=PASS')"
      - name: Preserve source proof and bounded local reviewer report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v510-hardened-original-cpp-reviewer-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/v59-source-audit.json
            build/v59-reviewer-audit.json
            tools/mesh_studio/web/test-results/v59-original-reviewer.json
            tools/mesh_studio/web/test-results/v59-p1-source-uv.svg
          if-no-files-found: warn
          retention-days: 14
