name: Research F29 original QUAD capability and derived recovery gates

on:
  push:
    branches: [research/benchmark-corpus-reverse-patches]
    paths:
      - .github/workflows/research-f29-quad-capability-and-recovery.yml
      - docs/research/nonmanifold-benchmark/probes/thingi10k_f29_quad_capability_and_recovery.py
      - docs/research/nonmanifold-benchmark/probes/test_thingi10k_f29_quad_capability_and_recovery.py
      - docs/research/nonmanifold-benchmark/probes/thingi10k_f29_optional_trimesh_quad_crosscheck.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native-capability-and-synthetic-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout code-only research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit pinned original native C++ QUAD/quality semantics
        run: |
          python3 docs/research/nonmanifold-benchmark/probes/thingi10k_f29_quad_capability_and_recovery.py --source-root .
      - name: Recheck native F27 TRI evidence hermetic cases
        run: |
          python3 -m unittest discover -s docs/research/nonmanifold-benchmark/probes -p test_thingi10k_f27_native_tri_evidence.py -v
      - name: Recheck F28 source-aware stitching hermetic cases
        run: |
          python3 -m unittest discover -s docs/research/nonmanifold-benchmark/probes -p test_thingi10k_f28_topology_aware_stitch.py -v
      - name: Prove F29 patch-QUAD-only synthetic and rejection contracts
        run: |
          python3 -m unittest discover -s docs/research/nonmanifold-benchmark/probes -p test_thingi10k_f29_quad_capability_and_recovery.py -v
      - name: Refuse accidental model-specific private geometry in checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          suspect = [p for p in root.rglob('*293137*')
                     if p.is_file() and p.suffix.lower() in {'.stl','.bp','.obj','.zip'}]
          assert not suspect, 'Third-party model-derived original/raw geometry is forbidden in CI checkout'
          report = root/'docs/research/nonmanifold-benchmark/evidence/thingi10k/thingi10k_f29_real_derived_patch_quad_receipt.json'
          assert report.is_file()
          import json
          evidence = json.loads(report.read_text(encoding='utf-8'))
          assert evidence['native_original_quad_generator_executed'] is False
          assert evidence['scientific_reference_comparison_admitted'] is False
          assert evidence['published_source_or_derived_geometry'] is False
          print('Original STL / OBJ / BP asset exclusion and F29 scientific boundary PASS')
          PY
