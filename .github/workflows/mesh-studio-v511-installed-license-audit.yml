name: Mesh Studio V5.11 installed license evidence — Windows and Linux source-bound

on:
  push:
    branches:
      - audit/mesh-studio-v511-runtime-license-evidence-20261123
    paths:
      - '.github/workflows/mesh-studio-v511-installed-license-audit.yml'
      - 'tools/mesh_studio/v511_runtime_license_evidence.py'
      - 'tools/mesh_studio/v511_license_evidence_reaudit.py'
      - 'tools/mesh_studio/web/package-lock.json'
      - 'tools/mesh_studio/web/package.json'
      - 'tools/mesh_studio/local_launcher.py'
      - 'tools/mesh_studio/local_static_site.py'
      - 'tools/mesh_studio/locks/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-studio-v511-license-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-license-by-os:
    name: installed-licenses-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/mesh_studio/locks/requirements-web-ci-linux-py313.lock
            tools/mesh_studio/locks/requirements-web-ci-windows-py313.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mesh_studio/web/package-lock.json
      - name: Build exact known V5.11 React/vtk.js static UI and 13-package isolated Python backend
        run: python -m tools.mesh_studio.local_reviewer_launcher build --receipt build/v511-build-license-scope.json
      - name: Check immutable independently certified static bundle digest before license scope analysis
        run: |
          python -c "from pathlib import Path; from hashlib import sha256; p=Path('tools/mesh_studio/web/dist/.apmesh-local-review-inventory.json'); assert sha256(p.read_bytes()).hexdigest()=='ad6c4627090a335c0ed7e3bf1bae0c0d062ed1e48249f120b10f3ba8ff8a85f5', 'not_the_certified_research_browser_bundle'; print('V511_EXACT_STATIC_UI_LICENSE_SCOPE=PASS')"
      - name: Extract actual installed and source-hash-bound Python distribution LICENSE/NOTICE texts (no scientific heavy packages)
        run: |
          python -c "from tools.mesh_studio.local_launcher import _venv_python; import subprocess; subprocess.run([str(_venv_python()), '-m', 'tools.mesh_studio.v511_runtime_license_evidence', '--scope', 'python', '--out-dir', 'build/v511-license-evidence'], check=True)"
      - name: Extract npm-ci installed packages plus original LICENSE/NOTICE bytes from locked npm release tarballs
        run: |
          python -m tools.mesh_studio.v511_runtime_license_evidence --scope npm --out-dir build/v511-license-evidence
      - name: Preserve installed sources, license text evidence and unresolved obligations; NOT distribution permission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-installed-license-${{ matrix.os }}-${{ github.sha }}
          path: build/v511-license-evidence/
          if-no-files-found: error
          retention-days: 90

  independent-installed-license-reopen:
    name: independent-win-linux-licenses
    needs: installed-license-by-os
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Recover both source-locked OS evidence sets, with actual installed license texts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-installed-license-*-${{ github.sha }}
          path: build/v511-license-two-host
          merge-multiple: false
      - name: Independently audit original source sha, all dependency versions, every actual installed LICENSE/NOTICE file and unresolved status
        run: |
          python -m tools.mesh_studio.v511_license_evidence_reaudit --directory build/v511-license-two-host --head-sha ${{ github.sha }} --output build/v511-license-two-host-proof.json
      - name: Preserve independent exact source and license notices reopening record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-independent-installed-license-proof-${{ github.sha }}
          path: build/v511-license-two-host-proof.json
          if-no-files-found: error
          retention-days: 90
