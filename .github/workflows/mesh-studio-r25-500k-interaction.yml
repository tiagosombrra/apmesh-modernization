name: Mesh Studio / R2.5 bounded 500k navigation and source-ID preview
on:
  push:
    branches:
      - feature/mesh-studio-fixture-first-20261114
    paths:
      - '.github/workflows/mesh-studio-r25-500k-interaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-500k-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      APMESH_R25_500K: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install local scientific service
        run: python -m pip install fastapi==0.128.2 uvicorn==0.48.0 httpx==0.28.1
      - name: Install frontend packages
        working-directory: tools/mesh_studio/web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build actual frontend
        working-directory: tools/mesh_studio/web
        run: npm run build
      - name: Install Chromium and software GL dependencies
        working-directory: tools/mesh_studio/web
        run: npx playwright install --with-deps chromium
      - name: Run opt-in 500k repeated motion, picking and subset test
        working-directory: tools/mesh_studio/web
        run: npm run test:e2e -- --grep 'R2.5 opt-in repeated 500k viewer orbit'
      - name: Retain measured 500k interaction data (required)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r25-500k-navigation-${{ github.sha }}
          path: tools/mesh_studio/web/test-results/r25-500k-controlled-navigation.json
          if-no-files-found: error
          retention-days: 14
