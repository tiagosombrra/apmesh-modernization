name: Mesh Studio / independent contracts and browser spike
on:
  push:
    branches:
      - audit/mesh-studio-v511-third-party-notices-candidate-20261123
      - feature/mesh-studio-fixture-first-20261114
      - feature/mesh-studio-r27-bvh-20261116
      - feature/mesh-studio-v55-pinned-actions-20261122
    paths:
      - 'tools/mesh_studio/**'
      - 'docs/mesh-studio/EVIDENCE_REGISTRY.json'
      # Documentation-only edits do not change Python/TS/native behavior.
      - '!tools/mesh_studio/README.md'
      - '!tools/mesh_studio/web/README.md'
      - '!tools/mesh_studio/fixtures/README.md'
      # Pure CSS changes are verified by the fast real P1 browser lane;
      # original C++ acceptance and numerical source artifacts do not change.
      - '!tools/mesh_studio/web/src/style.css'
      - 'research/mesh_studio/**'
      # Original geometry, native ABI, data and research hooks are exact-source
      # scientific dependencies; none may silently bypass the native gates.
      - 'research/quad/**'
      - 'src/**'
      - 'include/**'
      - 'tests/quad/**'
      - 'configs/**'
      - 'input_models/**'
      - 'reference/**'
      - 'libs/**'
      - 'cmake/**'
      - 'MANIFEST.sha256'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'docs/mesh-studio/*PREREGISTERED*.md'
      - '.github/workflows/mesh-studio-validation.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push supersedes a stale automatic source-ci run on this branch.
  # Manually dispatched scientific captures use a separate non-cancelling group.
  group: ${{ github.event_name == 'workflow_dispatch' && format('mesh-studio-manual-{0}', github.ref) || format('mesh-studio-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  scientific-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      APMESH_CI_HEADLESS_NO_OPENGL: ${{ matrix.os == 'windows-2022' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/mesh_studio/locks/requirements-web-ci-*.lock
      - name: Verify exact npm and Linux Windows Python source dependency locks
        run: python -m tools.mesh_studio.dependency_lock_audit
      - name: Install complete SHA256-hashed platform-specific Python 3.13 research dependencies
        run: python -m pip install --require-hashes -r tools/mesh_studio/locks/requirements-web-ci-${{ matrix.os == 'windows-2022' && 'windows' || 'linux' }}-py313.lock
      - name: Verify installed research environment dependency consistency
        run: python -m pip check
      - name: Install Linux OpenGL software rendering context
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libosmesa6 xvfb
      - name: Linux complete scientific/VTK regression under virtual X server
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python -m unittest discover -s tools/mesh_studio -p 'test_*.py' -t . -v
      - name: Measure V5 exact-source original P1 and staged Band API cache impact
        if: runner.os == 'Linux'
        run: python -m tools.mesh_studio.benchmark_web_cache --pairs 16 --output build/mesh-studio/v5-source-web-cache-benchmark.json
      - name: Retain actual source SHA pinned V5 cold and warm API timings
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v5-source-web-cache-${{ github.sha }}
          path: build/mesh-studio/v5-source-web-cache-benchmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Windows scientific regression; hosted GPU renderer explicitly unqualified
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools/mesh_studio -p 'test_*.py' -t . -v
      - name: Record Windows GPU gate remains open
        if: runner.os == 'Windows'
        run: echo 'Windows hosted runner has no qualified WGL/OSMesa; vtkAdapter render tests skipped explicitly. A GPU workstation smoke remains mandatory.'
      - name: Verify original fixture corpus
        run: python tools/mesh_studio/fixtures/validate.py
      - name: Measure bounded synthetic transfer size (not GPU or generator performance)
        if: runner.os == 'Linux'
        run: python -m tools.mesh_studio.scene_benchmark --cells 1000 50000 --output build/mesh-studio/transfer-size.json
      - name: Audit pinned real candidates and legacy archive without accepting adaptive epochs
        if: runner.os == 'Linux'
        run: python -m tools.mesh_studio.source_epoch_inventory --output build/mesh-studio/r2710-source-epoch-inventory.json
      - name: Retain read-only source/epoch qualification ledger
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-source-epoch-inventory-${{ github.sha }}
          path: build/mesh-studio/r2710-source-epoch-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Audit original TRI accepted/rejected native CI evidence (archived, not replayed)
        if: runner.os == 'Linux'
        run: python -m tools.mesh_studio.native_epoch_bridge --output build/mesh-studio/r2711-native-epoch-bridge.json
      - name: Retain original-native-epoch bridge without inventing a second accepted epoch
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-native-epoch-bridge-${{ github.sha }}
          path: build/mesh-studio/r2711-native-epoch-bridge.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain transport-size preflight receipt
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-transfer-preflight-${{ github.sha }}
          path: build/mesh-studio/transfer-size.json
          if-no-files-found: error
          retention-days: 7
  browser-spike:
    # Measure only the scene just qualified by the same original compiled C++
    # GeneratorAdaptive job, never a fixture or an unbound prior run artifact.
    needs: native-lineage-optin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mesh_studio/web/package-lock.json
      - name: Recover same-run original compiled accepted TRI for real Chromium performance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-r2720-native-accepted-scene-${{ github.sha }}
          path: build
      - name: Recover same-run original C++ source-attested Eistute/Book vector article figures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-v52-original-native-accepted-uv-vector-${{ github.sha }}
          path: build/v52-native-publication-artifact
      - name: Reject missing same-run original accepted TRI SVG and manifest before browser tests
        run: |
          python -c "from pathlib import Path; root=Path('build/v52-native-publication-artifact'); assert list(root.rglob('manifest.json')) and list(root.rglob('eistute-accepted-step1-uv.svg')) and list(root.rglob('book-accepted-step1-uv.svg'))"
      - name: Recover same-run source-bound typed-buffer capacity receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-r2722-original-visual-transfer-budget-${{ github.sha }}
          path: build/mesh-studio
      - name: Reject missing actual compiled original accepted TRI performance inputs
        run: |
          python -c "from pathlib import Path; assert Path('build/r2720-native-accepted-scene.json').is_file(); assert Path('build/mesh-studio/r2722-visual-transfer-budget.json').is_file()"
      - name: Install API dependencies
        run: python -m pip install fastapi==0.128.2 httpx==0.28.1 uvicorn==0.48.0
      - name: Verify committed original source and runtime dependency integrity locks
        run: python -m tools.mesh_studio.dependency_lock_audit
      - name: Install exact integrity-locked frontend dependency closure
        working-directory: tools/mesh_studio/web
        run: npm ci --no-audit --no-fund
      - name: Check R2.6 source-face lineage and bounded synthetic ray contracts
        working-directory: tools/mesh_studio/web
        run: npm run test:contracts
      - name: Verify production build
        working-directory: tools/mesh_studio/web
        run: npm run build
      - name: Install Chromium and dependencies
        working-directory: tools/mesh_studio/web
        run: npx playwright install --with-deps chromium
      - name: Execute real Chromium dual-view smoke and authentic original TRI performance
        working-directory: tools/mesh_studio/web
        run: npm run test:e2e -- --grep-invert 'V5\.11|V5\.9'
      - name: Independently audit actual original Chromium performance receipt and source SHA
        run: python -m tools.mesh_studio.native_browser_perf_audit --report build/mesh-studio/r2722-original-chromium-performance.json --scene build/r2720-native-accepted-scene.json --budget build/mesh-studio/r2722-visual-transfer-budget.json --output build/mesh-studio/r2722-chromium-audit.json
      - name: Retain exact-source original Chromium import interaction and JS heap measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2722-real-native-chromium-${{ github.sha }}
          path: |
            build/mesh-studio/r2722-original-chromium-performance.json
            build/mesh-studio/r2722-chromium-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded browser screenshots and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-chromium-${{ github.sha }}
          path: tools/mesh_studio/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
  native-lineage-optin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/mesh_studio/locks/requirements-native-pdf-ci-linux-py313.lock
      - name: Independently check exact native source publication dependency locks
        run: python -m tools.mesh_studio.dependency_lock_audit
      - name: Install SHA256-hashed isolated original-source vector publication dependencies
        run: python -m pip install --require-hashes -r tools/mesh_studio/locks/requirements-native-pdf-ci-linux-py313.lock
      - name: Check native original source PDF and Python dependency resolution
        run: python -m pip check
      - name: Configure isolated serial C++ original-generator research capture
        run: |
          cmake -S . -B build/r2712-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAP_MESH_USE_MPI=OFF -DAP_MESH_USE_OPENMP=OFF -DAP_MESH_ENABLE_LTO=OFF -DAP_MESH_ENABLE_RESEARCH_LINEAGE=ON
      - name: Build original GeneratorAdaptive with research-only post-commit observation
        run: cmake --build build/r2712-native --target quad_generator_outcome_probe --parallel 3
      - name: Verify original Eistute native accepted-epoch face, patch, UV and source-curve records
        run: python -m tools.mesh_studio.verify_native_lineage --exe build/r2712-native/bin/quad_generator_outcome_probe --root . --model eistute --out-dir build/r2712-native-evidence
      - name: Verify original Book native accepted-epoch face, patch, UV and source-curve records
        run: python -m tools.mesh_studio.verify_native_lineage --exe build/r2712-native/bin/quad_generator_outcome_probe --root . --model book --out-dir build/r2712-native-evidence
      - name: Reparse retained original face/patch/curve bytes against source-bound digests
        run: python -m tools.mesh_studio.audit_retained_native_lineage --directory build/r2712-native-evidence
      - name: Audit genuine C++ original precommit acceptance gates against independently accepted native commits
        run: python -m tools.mesh_studio.native_acceptance_gate_forensics --directory build/r2712-native-evidence --output build/r2723-original-native-acceptance-gates.json
      - name: Retain R2.7.23 original C++ source-bound acceptance predicates without promoting rejected trials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2723-original-acceptance-gate-forensics-${{ github.sha }}
          path: build/r2723-original-native-acceptance-gates.json
          if-no-files-found: error
          retention-days: 14
      - name: Audit original native shared-source-curve patch adjacency (not physical node welding)
        run: python -m tools.mesh_studio.native_source_adjacency --directory build/r2712-native-evidence --output build/r2714-source-adjacency.json
      - name: Audit sampled UV XYZ and logical-node seams on real accepted native TRI faces
        run: python -m tools.mesh_studio.native_seam_samples --directory build/r2712-native-evidence --output build/r2715-native-sampled-seams.json
      - name: Derive original native read-only nonwelded many-patch seam sample correspondences
        run: python -m tools.mesh_studio.native_seam_correspondence --directory build/r2712-native-evidence --output build/r2716-native-correspondence.json
      - name: Audit original accepted native UV00 ID versus real postcommit source curve endpoints
        run: python -m tools.mesh_studio.native_corner_origin --directory build/r2712-native-evidence --output build/r2717-native-corner-origin.json
      - name: Audit actual provisional Adapter boundary closure against accepted C++ submesh ownership
        run: python -m tools.mesh_studio.native_boundary_ownership --directory build/r2712-native-evidence --output build/r2718-boundary-cpp-ownership.json
      - name: Generate source-bound read-only native nonwelded Inspector bundle
        run: python -m tools.mesh_studio.native_identity_inspector --directory build/r2712-native-evidence --output build/r2719-native-inspector.json
      - name: Export real accepted native TRI per-face XYZ UV and original source IDs
        run: python -m tools.mesh_studio.native_accepted_scene --directory build/r2712-native-evidence --output build/r2720-native-accepted-scene.json
      - name: Export original C++ accepted Eistute and Book TRI patch-local UV true-vector publication
        run: python -m tools.mesh_studio.native_accepted_vector_publication --mode export --original-directory build/r2712-native-evidence --scene build/r2720-native-accepted-scene.json --output-dir build/v52-native-accepted-uv-publication
      - name: Independently re-open original C++ NDJSON and exact SVG native face/curve/patch receipts
        run: python -m tools.mesh_studio.native_accepted_vector_publication --mode audit --original-directory build/r2712-native-evidence --scene build/r2720-native-accepted-scene.json --output-dir build/v52-native-accepted-uv-publication
      - name: Archive original source-attested accepted Eistute/Book SVG figure and source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v52-original-native-accepted-uv-vector-${{ github.sha }}
          path: |
            build/v52-native-accepted-uv-publication/
            build/r2720-native-accepted-scene.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate two-page original Eistute/Book accepted source TRI PDF with embedded font and true vector paths
        run: python -m tools.mesh_studio.native_accepted_vector_pdf --mode export --original-directory build/r2712-native-evidence --scene build/r2720-native-accepted-scene.json --v52-dir build/v52-native-accepted-uv-publication --output-dir build/v53-original-native-vector-pdf
      - name: Independently re-open original accepted C++ source NDJSON and audit every PDF TRI/curve vector path, embedded fonts and physical page sizes
        run: python -m tools.mesh_studio.native_accepted_vector_pdf --mode audit --original-directory build/r2712-native-evidence --scene build/r2720-native-accepted-scene.json --v52-dir build/v52-native-accepted-uv-publication --output-dir build/v53-original-native-vector-pdf
      - name: Retain V5.3 original-source true-vector article PDF and replayable figure recipe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v53-original-native-accepted-article-pdf-${{ github.sha }}
          path: |
            build/v53-original-native-vector-pdf/
            build/v52-native-accepted-uv-publication/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Independently audit source-sha-pinned accepted TRI seam edges across every patch
        run: python -m tools.mesh_studio.native_seam_edges --directory build/r2712-native-evidence --output build/r2721-original-native-seam-edges.json
      - name: Compute R2.7.22 real native scene CPU typed-buffer capacity from original source bytes
        run: python -m tools.mesh_studio.native_scene_perf_budget --original-directory build/r2712-native-evidence --scene build/r2720-native-accepted-scene.json --output build/mesh-studio/r2722-visual-transfer-budget.json
      - name: Retain original-source R2.7.22 deterministic CPU transfer budget
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2722-original-visual-transfer-budget-${{ github.sha }}
          path: build/mesh-studio/r2722-visual-transfer-budget.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain native R2.7.21 read-only per-patch actual TRI edge qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2721-original-native-seam-edges-${{ github.sha }}
          path: build/r2721-original-native-seam-edges.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain R2.7.20 independent original Eistute Book accepted TRI scene bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2720-native-accepted-scene-${{ github.sha }}
          path: build/r2720-native-accepted-scene.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain original R2.7.19 Inspector import manifest for independent local viewer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2719-native-inspector-${{ github.sha }}
          path: build/r2719-native-inspector.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain original R2.7.18 C++ pointer-comparison receipt without raw addresses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2718-native-boundary-ownership-${{ github.sha }}
          path: build/r2718-boundary-cpp-ownership.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain native R2.7.17 original source-corner witness without numeric changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2717-original-corner-origin-${{ github.sha }}
          path: build/r2717-native-corner-origin.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain R2.7.16 original native sample associations without overwriting any node IDs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2716-nonwelded-correspondence-${{ github.sha }}
          path: build/r2716-native-correspondence.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain R2.7.15 original-source sampled interface report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2715-sampled-seams-${{ github.sha }}
          path: build/r2715-native-sampled-seams.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain original-source adjacency evidence with explicit LOD exclusions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2714-source-adjacency-${{ github.sha }}
          path: build/r2714-source-adjacency.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain original NDJSON face records and source-bound summaries together
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2712-native-original-source-${{ github.sha }}
          path: build/r2712-native-evidence/*
          if-no-files-found: error
          retention-days: 7
      - name: Configure native serial generator with research lineage disabled for numerical parity
        run: |
          cmake -S . -B build/r2713-default-off -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DAP_MESH_USE_MPI=OFF -DAP_MESH_USE_OPENMP=OFF -DAP_MESH_ENABLE_LTO=OFF -DAP_MESH_ENABLE_RESEARCH_LINEAGE=OFF
      - name: Build original serial GeneratorAdaptive with instrumentation OFF
        run: cmake --build build/r2713-default-off --target quad_generator_outcome_probe --parallel 3
      - name: Prove Eistute real C++ original acceptance, OBJ and scientific CSV/JSON byte parity OFF vs ON
        run: python -m tools.mesh_studio.native_lineage_parity --exe-off build/r2713-default-off/bin/quad_generator_outcome_probe --exe-on build/r2712-native/bin/quad_generator_outcome_probe --root . --model eistute --out-dir build/r2713-parity-evidence
      - name: Prove Book real C++ original acceptance, OBJ and scientific CSV/JSON byte parity OFF vs ON
        run: python -m tools.mesh_studio.native_lineage_parity --exe-off build/r2713-default-off/bin/quad_generator_outcome_probe --exe-on build/r2712-native/bin/quad_generator_outcome_probe --root . --model book --out-dir build/r2713-parity-evidence
      - name: Retain native OFF/ON numerical parity receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-r2713-native-numerical-parity-${{ github.sha }}
          path: build/r2713-parity-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Run R2.7.24 preregistered original native Eistute and Book isolated single-factor generation experiments
        run: python -m tools.mesh_studio.native_controlled_sensitivity --exe build/r2712-native/bin/quad_generator_outcome_probe --root . --original-directory build/r2712-native-evidence --out-dir build/r2724-controlled-native-treatment-evidence --timeout 300
      - name: Independently re-audit R2.7.24 original model/config/executable SHAs and genuine native postcommit trial sidecars
        run: python -m tools.mesh_studio.native_sensitivity_audit --exe build/r2712-native/bin/quad_generator_outcome_probe --root . --original-directory build/r2712-native-evidence --treatments build/r2724-controlled-native-treatment-evidence --output build/r2724-controlled-native-sensitivity-audit.json
