name: Mesh Studio V5.4 / bootstrap reviewed transitive dependency locks
on:
  push:
    branches:
      - feature/mesh-studio-r27-bvh-20261116
    paths:
      - '.github/workflows/mesh-studio-lock-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-studio-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact runtime and generate complete npm integrity lock
        working-directory: tools/mesh_studio/web
        run: |
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); const l=JSON.parse(fs.readFileSync('package-lock.json')); const same=(a,b)=>Object.keys(a).length===Object.keys(b).length && Object.entries(a).every(([k,v])=>b[k]===v); if(l.lockfileVersion!==3 || !same(l.packages[''].dependencies,p.dependencies) || !same(l.packages[''].devDependencies,p.devDependencies))process.exit(1); const all=Object.entries(l.packages).filter(([k])=>k); if(all.length<50 || all.some(([k,v])=>v.resolved && !v.integrity))process.exit(2); console.log('V54_NPM_TRANSITIVE_INTEGRITY_PACKAGES='+all.length)"
      - name: Install exact lock from clean node_modules and rebuild the source
        working-directory: tools/mesh_studio/web
        run: |
          npm ci --no-audit --no-fund
          npm run test:contracts
          npm run build
      - name: Archive generated npm dependency closure (for later review and commit)
        uses: actions/upload-artifact@v4
        with:
          name: mesh-studio-v54-npm-lock-${{ github.sha }}
          path: tools/mesh_studio/web/package-lock.json
          if-no-files-found: error
          retention-days: 14

  python-313:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: api-linux
            os: ubuntu-24.04
            requirements: tools/mesh_studio/requirements-web-ci.txt
            lock: tools/mesh_studio/locks/requirements-web-ci-linux-py313.lock
          - label: api-windows
            os: windows-2022
            requirements: tools/mesh_studio/requirements-web-ci.txt
            lock: tools/mesh_studio/locks/requirements-web-ci-windows-py313.lock
          - label: native-pdf-linux
            os: ubuntu-24.04
            requirements: tools/mesh_studio/requirements-native-pdf-ci.txt
            lock: tools/mesh_studio/locks/requirements-native-pdf-ci-linux-py313.lock
    name: python-313-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned compatible lock resolver
        run: |
          python -m pip install pip==25.3 pip-tools==7.5.2
          python -m pip --version
          python -c "from importlib.metadata import version; assert version('pip-tools') == '7.5.2'; print('V54_PIP_TOOLS='+version('pip-tools'))"
      - name: Resolve and hash every transitive dependency under this platform
        shell: bash
        run: |
          mkdir -p tools/mesh_studio/locks
          python -m piptools compile --resolver=backtracking --generate-hashes --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file "${{ matrix.lock }}" "${{ matrix.requirements }}"
      - name: Prove exact resolved platform wheel hashes install cleanly
        run: |
          python -m pip install --require-hashes -r ${{ matrix.lock }}
          python -m pip check
      - name: Verify all lock entries pin versions and nonempty SHA256 hashes
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; s=Path('${{ matrix.lock }}').read_text(); names=re.findall(r'(?m)^([a-zA-Z0-9_.-]+)==([a-zA-Z0-9_.!+]+)', s); hashes=re.findall(r'--hash=sha256:([0-9a-f]{64})',s); assert len(names)>=6 and len(hashes)>=len(names), (len(names),len(hashes)); assert '--hash=sha256:' in s; print('V54_PYTHON_HASH_LOCK_PINS='+str(len(names))+',SHA256='+str(len(hashes)))"
      - name: Retain version-complete hash lock for independent review
        uses: actions/upload-artifact@v4
        with:
          name: mesh-studio-v54-python-lock-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.lock }}
          if-no-files-found: error
          retention-days: 14
