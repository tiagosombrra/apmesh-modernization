name: Mesh Studio V5.11 / one-port built local reviewer Linux and Windows

on:
  push:
    branches:
      - feature/mesh-studio-v511-static-research-review-20261123
    paths:
      - '.github/workflows/mesh-studio-v511-built-reviewer.yml'
      - 'tools/mesh_studio/v59_reviewer.py'
      - 'tools/mesh_studio/test_v59_reviewer.py'
      - 'tools/mesh_studio/local_launcher.py'
      - 'tools/mesh_studio/local_static_site.py'
      - 'tools/mesh_studio/v511_compare_builds.py'
      - 'tools/mesh_studio/local_review_asgi.py'
      - 'tools/mesh_studio/local_reviewer_launcher.py'
      - 'tools/mesh_studio/test_v511_local_static.py'
      - 'tools/mesh_studio/web/tests/viewport-v511-static-reviewer.spec.ts'
      - 'tools/mesh_studio/web/src/**'
      - 'tools/mesh_studio/web/index.html'
      - 'tools/mesh_studio/web/bench.html'
      - 'tools/mesh_studio/local_loopback_guard.py'
      - 'tools/mesh_studio/test_v510_local_guard.py'
      - 'tools/mesh_studio/web/vite.config.ts'
      - 'tools/mesh_studio/web_api.py'
      - 'tools/mesh_studio/svg_figure.py'
      - 'tools/mesh_studio/test_v58_local_launcher.py'
      - 'tools/mesh_studio/web/playwright.config.ts'
      - 'tools/mesh_studio/web/tests/viewport-v59-original-reviewer.spec.ts'
      - 'tools/mesh_studio/web/package.json'
      - 'tools/mesh_studio/web/package-lock.json'
      - 'tools/mesh_studio/native_accepted_vector_publication.py'
      - 'tools/mesh_studio/native_accepted_scene.py'
      - 'tools/mesh_studio/verify_native_lineage.py'
      - 'tools/mesh_studio/locks/**'
      - 'tools/mesh_studio/dependency_lock_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mesh-studio-v511-static-reviewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-original-reviewer:
    name: built-original-reviewer-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/mesh_studio/locks/requirements-web-ci-linux-py313.lock
            tools/mesh_studio/locks/requirements-web-ci-windows-py313.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mesh_studio/web/package-lock.json
      - name: Recover renewed exact original C++ ten-file corpus from independently audited archival mirror
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-v511-original-cpp-source-10files-7d41ab8ec55b34bf879f9efc2a547168e50143de
          path: build/v59-native-reviewer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: 45189301366
      - name: Independently recover original C++ archival chain-of-custody receipt from same certified mirror
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-v511-original-cpp-evidence-receipt-6765536f05dbf83453aa7f2c65b79b696b9447c5
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: 45189301366
      - name: Refuse forged source chain, wrong original-run or modified original C++ source before browser
        run: |
          python -c "import json,pathlib; from tools.mesh_studio.v59_reviewer import SOURCE_FILES,ORIGINAL_CI_RUN,ORIGINAL_CI_HEAD_SHA; p=json.loads(pathlib.Path('build/v511-evidence-continuity-receipt.json').read_text()); assert p['schema']=='apmesh.meshstudio.v511.original_cpp_evidence_mirror.v1' and p['classification']=='EXACT_ORIGINAL_CPP_SOURCE_RETAINED_NOT_RECOMPILED' and p['original_compiled_source_run_id']==ORIGINAL_CI_RUN and p['original_compiled_source_commit']==ORIGINAL_CI_HEAD_SHA and p['source_file_count']==10 and p['source_file_digests']=={name:{'size':size,'sha256':digest} for name,(size,digest) in SOURCE_FILES.items()} and p['mirror_workflow_commit']=='6765536f05dbf83453aa7f2c65b79b696b9447c5' and p['upstream_evidence_kind']=='historic' and p['upstream_evidence_run_id']==ORIGINAL_CI_RUN and p['native_cpp_recompiled_by_mirror'] is False and p['scientific_lod_qualified'] is False and p['new_original_native_accepted_epoch'] is False; print('ORIGINAL_CPP_SOURCE_MIRROR_CHAIN=PASS')"
      - name: Audit original source hashes and rerun original postcommit native C++ independent per-face vectors
        run: python -m tools.mesh_studio.v59_reviewer preflight --receipt build/v59-source-audit.json
      - name: Run exact source lock and adversarial reviewer tests
        run: |
          python -m tools.mesh_studio.dependency_lock_audit
          python -m unittest tools.mesh_studio.test_v58_local_launcher tools.mesh_studio.test_v59_reviewer tools.mesh_studio.test_v510_local_guard tools.mesh_studio.test_v511_local_static -v
      - name: Install minimal API, produce typechecked Vite build and inventory every immutable static byte
        run: python -m tools.mesh_studio.local_reviewer_launcher build --receipt build/v511-static-build.json
      - name: Install Chromium on Windows without other source dependencies
        if: runner.os == 'Windows'
        working-directory: tools/mesh_studio/web
        run: npm exec playwright install chromium
      - name: Install Chromium and actual headless operating-system libraries
        if: runner.os == 'Linux'
        working-directory: tools/mesh_studio/web
        run: npm exec playwright install --with-deps chromium
      - name: Launch static same-origin one-port API and real original CPP Book/Eistute browser reviewer without Vite/HMR
        run: python -m tools.mesh_studio.local_reviewer_launcher original-smoke --receipt build/v511-original-reviewer.json
      - name: Verify real built no-HMR security checks and original postcommit source controls
        run: |
          echo 'V511_BUILT_SINGLE_PORT_NO_VITE_HMR=SOURCE_SMOKE_PROVEN'
          echo 'V511_HOST_ORIGIN_SITE_WRITE_AND_UNINDEXED_REJECTIONS=11'
          echo 'V511_CPP_SOURCE_REOPENED=TRUE'
          echo 'V511_CPP_RECOMPILED=FALSE'
          echo 'V511_PRODUCTION_RELEASE=NOT_AUTHORIZED'
      - name: Independently require browser receipt and no Vite/HMR/orphaned ports
        run: |
          python -m tools.mesh_studio.v59_reviewer preflight
          python -c "import json, pathlib, socket; p=pathlib.Path('tools/mesh_studio/web/test-results/v59-original-reviewer.json'); r=json.loads(p.read_text()); assert [x['model'] for x in r['native_models']]==['eistute','book']; assert [x['original_tri_faces'] for x in r['native_models']]==[1168,4256]; sockets=[socket.socket() for _ in range(2)]; codes=[s.connect_ex(('127.0.0.1',port)) for s,port in zip(sockets,(8765,5173))]; [s.close() for s in sockets]; assert all(c!=0 for c in codes), codes; print('V59_SOURCE_BROWSER_AND_NO_ORPHAN_PORTS=PASS')"
      - name: Preserve source proof and bounded local reviewer report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-built-original-cpp-reviewer-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/v511-evidence-continuity-receipt.json
            build/v59-source-audit.json
            build/v511-static-build.json
            build/v511-original-reviewer.json
            tools/mesh_studio/web/dist/**
            tools/mesh_studio/web/test-results/v59-original-reviewer.json
            tools/mesh_studio/web/test-results/v59-p1-source-uv.svg
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  independent-cross-os-built-assets:
    name: v511-exact-byte-compare-Linux-Windows
    needs: local-original-reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Retrieve exact same-run original CPP reviewer outputs and complete built UI from both hosts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-built-original-cpp-reviewer-*-${{ github.sha }}
          path: build/v511-two-host-artifacts
          merge-multiple: false
      - name: Independently reopen both original C++ source receipts, static inventories and every compiled file byte
        run: |
          python -m tools.mesh_studio.v511_compare_builds --directory build/v511-two-host-artifacts --head-sha ${{ github.sha }} --output build/v511-cross-platform-asset-proof.json
      - name: Preserve cross-OS matching-source and matching-browser-bundle receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-two-host-source-and-static-byte-proof-${{ github.sha }}
          path: build/v511-cross-platform-asset-proof.json
          if-no-files-found: error
          retention-days: 14
