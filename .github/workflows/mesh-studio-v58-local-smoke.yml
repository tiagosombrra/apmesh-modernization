name: Mesh Studio V5.8 / minimal read-only local launch Linux and Windows

on:
  push:
    branches:
      - feature/mesh-studio-v58-minimal-loopback-launch-20261123
    paths:
      - '.github/workflows/mesh-studio-v58-local-smoke.yml'
      - 'tools/mesh_studio/local_launcher.py'
      - 'tools/mesh_studio/test_v58_local_launcher.py'
      - 'tools/mesh_studio/dependency_lock_audit.py'
      - 'tools/mesh_studio/web_api.py'
      - 'tools/mesh_studio/web/package.json'
      - 'tools/mesh_studio/web/package-lock.json'
      - 'tools/mesh_studio/requirements-web-ci.txt'
      - 'tools/mesh_studio/locks/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-studio-v58-local-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-readonly-smoke:
    name: v58-local-research-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/mesh_studio/locks/requirements-web-ci-linux-py313.lock
            tools/mesh_studio/locks/requirements-web-ci-windows-py313.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/mesh_studio/web/package-lock.json
      - name: Audit source lock and adversarial runtime boundaries offline
        run: |
          python -m tools.mesh_studio.dependency_lock_audit
          python -m unittest tools.mesh_studio.test_v58_local_launcher -v
      - name: Preflight immutable source and required Node/Python toolchain
        run: python -m tools.mesh_studio.local_launcher preflight
      - name: Install only exact hash-approved local Python API closure and npm browser dependencies
        run: python -m tools.mesh_studio.local_launcher setup
      - name: Launch both actual servers on loopback, verify source-pinned API, SVG and Vite proxy, then shut down
        run: python -m tools.mesh_studio.local_launcher smoke
      - name: Reject orphan API or Vite listening processes
        run: |
          python -c "import socket; sockets = [socket.socket() for x in (8765,5173)]; result = [s.connect_ex(('127.0.0.1', p)) for s,p in zip(sockets,(8765,5173))]; [s.close() for s in sockets]; assert all(code != 0 for code in result), result; print('V58_NO_ORPHAN_LISTENERS=PASS')"
      - name: Record precise scientific and distribution exclusions
        run: |
          echo 'V58_LOOPBACK_ONLY=PASS'
          echo 'V58_API_PYMUPDF_VTK_NOT_INSTALLED=PASS'
          echo 'V58_ORIGINAL_CPP_NOT_REPLAYED=TRUE'
          echo 'V58_SCIENTIFIC_R28_LOD=BLOCKED'
          echo 'V58_PRODUCTION_RELEASE_NOT_AUTHORIZED=TRUE'
