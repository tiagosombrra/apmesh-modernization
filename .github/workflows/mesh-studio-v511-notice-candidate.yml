name: Mesh Studio V5.11 / original-source third-party notices candidate only

on:
  push:
    branches:
      - audit/mesh-studio-v511-third-party-notices-candidate-20261123
    paths:
      - '.github/workflows/mesh-studio-v511-notice-candidate.yml'
      - 'tools/mesh_studio/v511_notice_candidate.py'
      - 'tools/mesh_studio/v511_bundle_license_reaudit.py'
      - 'tools/mesh_studio/v511_license_evidence_reaudit.py'
      - 'tools/mesh_studio/v511_runtime_license_evidence.py'
      - 'tools/mesh_studio/web/package-lock.json'
      - 'tools/mesh_studio/locks/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mesh-studio-v511-notice-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_EVIDENCE_RUN: '45209742219'
  PINNED_EVIDENCE_SOURCE: 'fb665764143da62b9a44516654ed1057858c2639'

jobs:
  exact-source-notice-proposal:
    name: build-unreleased-linux-and-windows-notice-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Recover source-verified npm and installed Python original notices from certified Linux/Windows run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-installed-license-*-${{ env.PINNED_EVIDENCE_SOURCE }}
          path: build/v511-notice-source/installed
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: ${{ env.PINNED_EVIDENCE_RUN }}
      - name: Recover exact Vite/Rolldown compiled bundle attribution and native license metadata from same source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-bundle-*-${{ env.PINNED_EVIDENCE_SOURCE }}
          path: build/v511-notice-source/bundles
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: ${{ env.PINNED_EVIDENCE_RUN }}
      - name: Verify exact 26 source packages for each OS, preserve authentic licence text, detect original OS differences, never choose spark-md5 branch
        run: |
          python -m tools.mesh_studio.v511_notice_candidate --mode prepare --input build/v511-notice-source --output build/v511-third-party-notices-candidate --receipt build/v511-notice-candidate-builder-receipt.json
      - name: Preserve proposed notices and exact source text only for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-notices-candidate-${{ github.sha }}
          path: build/v511-third-party-notices-candidate/
          if-no-files-found: error
          retention-days: 90

  independent-source-and-draft-byte-replay:
    name: independently-reopen-every-original-notice-and-draft
    needs: exact-source-notice-proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Retrieve both original certified installed notice archives without trusting proposed document
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-installed-license-*-${{ env.PINNED_EVIDENCE_SOURCE }}
          path: build/v511-notice-source/installed
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: ${{ env.PINNED_EVIDENCE_RUN }}
      - name: Retrieve both original certified browser module graphs and Vite licenses
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mesh-studio-v511-bundle-*-${{ env.PINNED_EVIDENCE_SOURCE }}
          path: build/v511-notice-source/bundles
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tiagosombrra/apmesh-modernization
          run-id: ${{ env.PINNED_EVIDENCE_RUN }}
      - name: Download only newly proposed notice candidate built by the first job of same CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-studio-v511-notices-candidate-${{ github.sha }}
          path: build/v511-notice-readback
      - name: Recompute notices and independently compare every original OS source notice and exact proposed text byte
        run: |
          python -m tools.mesh_studio.v511_notice_candidate --mode audit --input build/v511-notice-source --output build/v511-notice-readback --receipt build/v511-notice-candidate-independent-readback.json
      - name: Publish no-release audit receipt, never an installer or license clearance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesh-studio-v511-notices-candidate-readback-${{ github.sha }}
          path: build/v511-notice-candidate-independent-readback.json
          if-no-files-found: error
          retention-days: 90
