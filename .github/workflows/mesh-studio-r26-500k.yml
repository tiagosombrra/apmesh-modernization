name: Mesh Studio / R2.6 synthetic 500k XYZ picking and full-coverage lineage
on:
  push:
    branches:
      - feature/mesh-studio-fixture-first-20261114
    paths:
      - '.github/workflows/mesh-studio-r26-500k.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r26-bounded-synthetic-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      APMESH_R26_500K: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only Python service
        run: python -m pip install fastapi==0.128.2 uvicorn==0.48.0 httpx==0.28.1
      - name: Install frontend dependencies
        working-directory: tools/mesh_studio/web
        run: npm install --no-audit --no-fund
      - name: Check pure source-ID and synthetic ray contracts
        working-directory: tools/mesh_studio/web
        run: npm run test:contracts
      - name: Build TypeScript production frontend
        working-directory: tools/mesh_studio/web
        run: npm run build
      - name: Install Chromium and GL requirements
        working-directory: tools/mesh_studio/web
        run: npx playwright install --with-deps chromium
      - name: Execute bounded 500k XYZ picking and original face partition test
        working-directory: tools/mesh_studio/web
        run: npm run test:e2e -- --grep 'R2.6 opt-in bounded 500k XYZ picker'
      - name: Publish source-mapped synthetic pick evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26-500k-synthetic-evidence-${{ github.sha }}
          path: tools/mesh_studio/web/test-results/r26-500k-xyz-picking-lineage.json
          if-no-files-found: error
          retention-days: 14
