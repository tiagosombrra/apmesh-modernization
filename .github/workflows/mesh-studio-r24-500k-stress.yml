name: Mesh Studio / R2.4 explicit 500k Chromium stress (diagnostic)
on:
  push:
    branches:
      - feature/mesh-studio-fixture-first-20261114
    paths:
      - '.github/workflows/mesh-studio-r24-500k-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-500k-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      APMESH_R22_500K: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only scientific service
        run: python -m pip install fastapi==0.128.2 uvicorn==0.48.0 httpx==0.28.1
      - name: Install frontend packages
        working-directory: tools/mesh_studio/web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build actual viewer
        working-directory: tools/mesh_studio/web
        run: npm run build
      - name: Install headless Chromium with software GL dependencies
        working-directory: tools/mesh_studio/web
        run: npx playwright install --with-deps chromium
      - name: Execute only the opt-in 500k first-render gate
        working-directory: tools/mesh_studio/web
        run: npm run test:e2e -- --grep 'R2.2 optional bounded 500k synthetic browser stress'
      - name: Upload bounded 500k Chromium receipt even after test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-500k-typed-synthetic-${{ github.sha }}
          path: tools/mesh_studio/web/test-results/
          if-no-files-found: error
          retention-days: 7
