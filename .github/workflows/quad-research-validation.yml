name: QUAD research native validation

on:
  push:
    branches:
      - 'quad/integration-*'
      - quad-templates
    paths-ignore:
      - 'docs/research/quad/**'
  pull_request:
    branches: [quad-templates]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quad-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quad-native:
    name: QUAD native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short
      - name: Configure and build native QUAD (Linux GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S tests/quad -B build/quad-ci-linux -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAP_MESH_QUAD_WITH_TREE=ON
          cmake --build build/quad-ci-linux --parallel 2
      - name: Run native QUAD contracts (Linux GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ctest --test-dir build/quad-ci-linux --output-on-failure --no-tests=error
          ./build/quad-ci-linux/quad_tree_demo "$RUNNER_TEMP/quad-native-tree.obj"
      - name: Upload actual C++ real-tree SVG and OBJ (Linux)
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-real-tree-visual-${{ github.sha }}
          path: |
            build/quad-ci-linux/real_tree_visual/manifest.json
            build/quad-ci-linux/real_tree_visual/tree_regions.csv
            build/quad-ci-linux/real_tree_visual/tree_visual.svg
            build/quad-ci-linux/real_tree_visual/quads_vertex_mean.obj
            build/quad-ci-linux/real_tree_visual/quads_area_centroid.obj
            build/quad-ci-linux/real_tree_visual/experimental_hybrid_manifest.json
            build/quad-ci-linux/real_tree_visual/experimental_hybrid.svg
            build/quad-ci-linux/real_tree_visual/quad_tri_interface.csv
            build/quad-ci-linux/real_tree_visual/hybrid_experimental_vertex_mean.obj
            build/quad-ci-linux/real_tree_visual/hybrid_experimental_area_centroid.obj
            build/quad-ci-linux/real_tree_visual/hybrid_research_local_delaunay_vertex_mean.obj
            build/quad-ci-linux/real_tree_visual/hybrid_research_local_delaunay_area_centroid.obj
            build/quad-ci-linux/real_tree_visual/research_local_delaunay_comparison.svg
            build/quad-ci-linux/real_tree_visual/research_local_delaunay_manifest.json
            build/quad-ci-linux/real_tree_visual/analytic_surface_research_vertex_mean.obj
            build/quad-ci-linux/real_tree_visual/analytic_surface_research_area_centroid.obj
            build/quad-ci-linux/real_tree_visual/analytic_surface_research_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Configure and build native QUAD (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S tests/quad -B build/quad-ci-msvc -G "Visual Studio 17 2022" -A x64 -DAP_MESH_QUAD_WITH_TREE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/quad-ci-msvc --config Debug --parallel 2
          exit $LASTEXITCODE
      - name: Run native QUAD contracts (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build/quad-ci-msvc -C Debug --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build/quad-ci-msvc/Debug/quad_tree_demo.exe" "$env:RUNNER_TEMP/quad-native-tree.obj"
          exit $LASTEXITCODE
      - name: Check experimental OMP Adapter syntax without changing legacy build defaults
        if: runner.os == 'Linux'
        shell: bash
        run: |
          c++ -std=c++17 -DUSE_OPENMP=1 -fopenmp -Iinclude -Wall -Wextra -fsyntax-only src/adapter/adapter.cpp
      - name: Publish bounded test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quad-failure-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/quad-ci-linux/Testing/Temporary/LastTest.log
            build/quad-ci-msvc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
  baseline-linux:
    name: TRI baseline and tooling controls (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install approved LLVM tools for scientific baseline
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/quad-tools-venv"
          "$RUNNER_TEMP/quad-tools-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: clang-tidy==22.1.8 clang-format==22.1.8
          echo "$RUNNER_TEMP/quad-tools-venv/bin" >> "$GITHUB_PATH"
      - name: Identify LLVM toolchain
        shell: bash
        run: |
          clang-tidy --version
          clang-format --version
      - name: Build unchanged TRI application and contract targets
        shell: bash
        run: |
          cmake --preset local-serial
          cmake --build --preset local-serial --parallel 2
      - name: Capture M3-5 diagnostic stack before root CTest
        shell: bash
        run: |
          # The backtrace is optional; mandatory root CTest is not.
          # GitHub-hosted apt mirrors can be temporarily unreachable.
          # Do not install dependencies over the network at this step.
          if command -v gdb >/dev/null 2>&1; then
            gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt 32' --args build/local-serial/bin/quad_adapter_integration_probe || true
          else
            echo "::warning title=Optional M3-5 debugger unavailable::gdb is not preinstalled; backtrace NOT COLLECTED. Mandatory root CTest follows without alteration."
          fi
      - name: Run full CTest baseline
        shell: bash
        run: ctest --preset local-serial --output-on-failure --no-tests=error
      - name: Record full original-source QUAD/AFT detached chart inventories
        shell: bash
        run: |
          set -o pipefail
          # Retain real physical node/element counts and rollbacks on both originals.
          # This does not authorize source boundary welding or patch observers.
          ctest --test-dir build/local-serial --verbose --tests-regex '^quad[.]r2c2[.]full_source_patch_stage$' --no-tests=error | tee build/local-serial/quad_r2c2_full_source_stage.log
      - name: Retain original full QUAD/AFT source chart staging receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c2-full-source-stage-${{ github.sha }}
          path: build/local-serial/quad_r2c2_full_source_stage.log
          if-no-files-found: error
          retention-days: 14
      - name: Export and independently validate R2c10 original disconnected QUAD AFT models
        shell: bash
        run: |
          set -o pipefail
          export APMESH_QUAD_R2C10_EXPORT_DIR="$PWD/build/local-serial/r2c10_original_detached_meshes"
          ctest --test-dir build/local-serial --verbose --tests-regex '^quad[.]r2c2[.]full_source_patch_stage$' --no-tests=error | tee build/local-serial/r2c10_original_mesh_export.log
          python3 tools/verify_r2c10_mesh_export.py --directory build/local-serial/r2c10_original_detached_meshes
          python3 tools/verify_r2c11_source_seam_atlas.py --directory build/local-serial/r2c10_original_detached_meshes
      - name: Retain R2c10 original unwelded QUAD AFT OBJ and verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c10-original-detached-meshes-${{ github.sha }}
          path: |
            build/local-serial/r2c10_original_detached_meshes/*.obj
            build/local-serial/r2c10_original_detached_meshes/*.csv
            build/local-serial/r2c10_original_detached_meshes/*.json
            build/local-serial/r2c10_original_mesh_export.log
          if-no-files-found: error
          retention-days: 14
      - name: R2c22 independently audit original patch UV and Bezier differential normals
        shell: bash
        run: |
          python3 tools/verify_r2c22_original_patch_uv_bezier_orientation.py \
            --directory build/local-serial/r2c10_original_detached_meshes \
            --output build/local-serial/r2c22_original_uv_bezier_orientation
      - name: Retain R2c22 real original UV / normal provenance and audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c22-original-uv-bezier-${{ github.sha }}
          path: |
            build/local-serial/r2c22_original_uv_bezier_orientation/r2c22_original_patch_uv_bezier_orientation.json
            build/local-serial/r2c10_original_detached_meshes/*_original_patch_uv_vertices.csv
            build/local-serial/r2c10_original_detached_meshes/*_original_bezier_facet_normals.csv
          if-no-files-found: error
          retention-days: 14
      - name: R2c21 independently audit original detached QUAD AFT indexed patch topology
        shell: bash
        run: |
          python3 tools/verify_r2c21_detached_chart_topology.py \
            --directory build/local-serial/r2c10_original_detached_meshes \
            --output build/local-serial/r2c21_patch_topology
      - name: Retain R2c21 original patch indexed edge and orientation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c21-patch-topology-${{ github.sha }}
          path: build/local-serial/r2c21_patch_topology/r2c21_original_detached_indexed_patch_topology.json
          if-no-files-found: error
          retention-days: 14
      - name: Record original-source disconnected owner staging and rollback
        shell: bash
        run: |
          # Retain actual original-model and synthetic chart fault results.
          # This proof does not authorize cross-patch physical connectivity.
          ctest --test-dir build/local-serial --verbose --tests-regex '^quad[.]r2c2[.]disjoint_owner_stage$' --no-tests=error | tee build/local-serial/quad_r2c2_disjoint_stage.log
      - name: Retain bounded detached source-model QUAD TRI owner receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c2-disjoint-owner-${{ github.sha }}
          path: build/local-serial/quad_r2c2_disjoint_stage.log
          if-no-files-found: error
          retention-days: 14
      - name: Record native R2b2 Bezier source patch admission
        shell: bash
        run: |
          # Repeat the already-registered native source test with retained output.
          # This makes exact per-model ACCEPT/REJECT counts independently visible.
          ctest --test-dir build/local-serial --verbose --tests-regex '^quad[.]r2b2[.]real_bezier_aft$' --no-tests=error | tee build/local-serial/quad_r2b2_source_admission.log
      - name: Retain R2b2 actual Bezier source admission report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2b2-real-bezier-admission-${{ github.sha }}
          path: build/local-serial/quad_r2b2_source_admission.log
          if-no-files-found: error
          retention-days: 14
      - name: Record true Adapter dynamically curved original AFT trial
        shell: bash
        run: |
          # This repeats two already required CTests verbosely to retain the
          # original AFT admission/rejection and unmodified TRI outcome trace.
          ctest --test-dir build/local-serial --verbose --tests-regex '^quad[.]generator[.]real_global_outcomes([.]book)?$' --no-tests=error | tee build/local-serial/quad_dynamic_source_aft.log
      - name: Retain original Adapter dynamic source AFT diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2b2-actual-source-aft-${{ github.sha }}
          path: build/local-serial/quad_dynamic_source_aft.log
          if-no-files-found: error
          retention-days: 14
      - name: Measure R2c13 actual accepted original GeneratorAdaptive source epochs
        shell: bash
        run: |
          python3 tests/quad/test_r2c13_m7_accepted_epochs.py \
            --exe build/local-serial/bin/quad_generator_outcome_probe \
            --root . \
            --directory build/local-serial/r2c13_generator_epochs
      - name: Diagnose R2c14 original rejected generator candidate quality and patch regressions
        shell: bash
        run: |
          python3 tools/diagnose_r2c14_generator_rejections.py \
            --directory build/local-serial/r2c13_generator_epochs
      - name: Diagnose R2c15 exact source-stable GeneratorAdaptive guard inequalities
        shell: bash
        run: |
          python3 tools/verify_r2c15_original_acceptance_guards.py \
            --directory build/local-serial/r2c13_generator_epochs \
            --root . \
            --engine-source src/generator/generator_adaptive.cpp
      - name: Diagnose R2c17 original Adapter native per-patch fallback attempts
        shell: bash
        run: |
          python3 tools/verify_r2c17_original_adapter_domain_fallback.py \
            --directory build/local-serial/r2c13_generator_epochs \
            --root . \
            --adapter-source src/adapter/adapter.cpp
      - name: Retain R2c17 exact original Adapter domain CSV and fallback report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c17-original-adapter-domain-${{ github.sha }}
          path: |
            build/local-serial/r2c13_generator_epochs/r2c17_original_adapter_fallback_forensics.json
            build/local-serial/r2c13_generator_epochs/*/*_domain_adaptation.csv
          if-no-files-found: error
          retention-days: 14
      - name: Measure R2c16 bounded original GeneratorAdaptive source-control profiles
        shell: bash
        run: |
          python3 tests/quad/test_r2c16_m7_bounded_research_profiles.py \
            --exe build/local-serial/bin/quad_generator_outcome_probe \
            --root . \
            --directory build/local-serial/r2c16_generator_research_profiles
      - name: Retain R2c16 source-bound control ablations (no acceptance overrides)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c16-source-ablation-${{ github.sha }}
          path: |
            build/local-serial/r2c16_generator_research_profiles/r2c16_original_generator_controlled_profiles.json
            build/local-serial/r2c16_generator_research_profiles/*/generator_stdout.log
            build/local-serial/r2c16_generator_research_profiles/*/generator_stderr.log
          if-no-files-found: error
          retention-days: 14
      - name: Retain R2c13 original generator accepted-step and rollback diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c13-original-generator-epochs-${{ github.sha }}
          path: |
            build/local-serial/r2c13_generator_epochs/r2c13_accepted_generator_epochs.json
            build/local-serial/r2c13_generator_epochs/r2c14_generator_rejection_forensics.json
            build/local-serial/r2c13_generator_epochs/r2c15_original_acceptance_guard_inequalities.json
            build/local-serial/r2c13_generator_epochs/*/*_acceptance_*.log
            build/local-serial/r2c13_generator_epochs/*/*_curve_adaptation_*.csv
            build/local-serial/r2c13_generator_epochs/*/*_patch_adaptation_*.csv
            build/local-serial/r2c13_generator_epochs/*/generator_stdout.log
            build/local-serial/r2c13_generator_epochs/*/generator_stderr.log
          if-no-files-found: error
          retention-days: 14
      - name: Build fail-closed R2c0 original source radial edge incidence records
        shell: bash
        run: |
          # Cross-check real PatchReader incidence graphs and source Bézier interval
          # proof logs. This does not publish/weld any physical nodes or elements.
          python3 tests/quad/test_r2c0_source_radial_incidence.py \
            --root . \
            --graph-directory build/local-serial/m4_sheet_incidence \
            --source-log build/local-serial/quad_dynamic_source_aft.log \
            --directory build/local-serial/r2c0_radial_incidence
      - name: Retain bounded source-linked R2c0 incidence and pending policy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c0-radial-incidence-${{ github.sha }}
          path: build/local-serial/r2c0_radial_incidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate source-bound R2c1 sheet review packets and draft semantics
        shell: bash
        run: |
          # All candidate continuations remain unapproved; no node owners change.
          python3 tests/quad/test_r2c1_sheet_review.py \
            --root . \
            --r2c0-directory build/local-serial/r2c0_radial_incidence \
            --directory build/local-serial/r2c1_sheet_review
      - name: Retain bounded R2c1 pending scientific review packets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c1-sheet-review-${{ github.sha }}
          path: build/local-serial/r2c1_sheet_review/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Bind original radial scientific records to exported physical seam atlas for advisor review
        shell: bash
        run: |
          python3 tools/build_r2c12_advisor_handoff.py \
            --root . \
            --radial-directory build/local-serial/r2c0_radial_incidence \
            --review-directory build/local-serial/r2c1_sheet_review \
            --mesh-directory build/local-serial/r2c10_original_detached_meshes \
            --output-directory build/local-serial/r2c12_advisor_handoff
      - name: Retain R2c12 model SHA-bound scientific advisor handoff (no welding)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c12-advisor-handoff-${{ github.sha }}
          path: build/local-serial/r2c12_advisor_handoff/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Measure R2c18 original AFT postprocess controls without changing TRI admission
        shell: bash
        run: |
          python3 tests/quad/test_r2c18_original_aft_postprocess_profiles.py \
            --exe build/local-serial/bin/quad_generator_outcome_probe \
            --root . \
            --directory build/local-serial/r2c18_aft_postprocess
      - name: Retain R2c18 original AFT postprocess research profiles and domain evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c18-original-aft-postprocess-${{ github.sha }}
          path: |
            build/local-serial/r2c18_aft_postprocess/r2c18_original_aft_postprocess_profiles.json
            build/local-serial/r2c18_aft_postprocess/*/generator_stdout.log
            build/local-serial/r2c18_aft_postprocess/*/generator_stderr.log
            build/local-serial/r2c18_aft_postprocess/*/*_domain_adaptation.csv
          if-no-files-found: error
          retention-days: 14
      - name: Verify R2c19 accepted Eistute TRI quality and bounded Book AFT joint recovery
        shell: bash
        run: |
          python3 tests/quad/test_r2c19_original_accepted_quality_book_joint_recovery.py \
            --exe build/local-serial/bin/quad_generator_outcome_probe \
            --root . \
            --r2c18-directory build/local-serial/r2c18_aft_postprocess \
            --directory build/local-serial/r2c19_quality_and_book_joint
      - name: Retain R2c19 native accepted TRI geometry-quality receipts and Book joint profiles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c19-original-tri-quality-book-joint-${{ github.sha }}
          path: |
            build/local-serial/r2c19_quality_and_book_joint/r2c19_original_accepted_tri_quality_book_joint_recovery.json
            build/local-serial/r2c19_quality_and_book_joint/*/generator_stdout.log
            build/local-serial/r2c19_quality_and_book_joint/*/generator_stderr.log
            build/local-serial/r2c19_quality_and_book_joint/*/*_domain_adaptation.csv
            build/local-serial/r2c18_aft_postprocess/eistute_aft_postprocess_quality_0p80/*_acceptance_accepted.log
            build/local-serial/r2c18_aft_postprocess/eistute_aft_postprocess_quality_0p80/*_patch_adaptation_accepted.csv
          if-no-files-found: error
          retention-days: 14
      - name: R2c20 independently inspect every original accepted TRI 3D OBJ face
        shell: bash
        run: |
          python3 tools/verify_r2c20_original_accepted_tri_obj_faces.py \
            --r2c13 build/local-serial/r2c13_generator_epochs \
            --r2c18 build/local-serial/r2c18_aft_postprocess \
            --output build/local-serial/r2c20_original_accepted_tri_faces
      - name: Retain R2c20 accepted original TRI OBJ models and face integrity report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-r2c20-original-accepted-tri-face-integrity-${{ github.sha }}
          path: |
            build/local-serial/r2c20_original_accepted_tri_faces/r2c20_original_accepted_tri_3d_face_integrity.json
            build/local-serial/r2c18_aft_postprocess/eistute_aft_postprocess_quality_0p80/*_malha_*.obj
            build/local-serial/r2c13_generator_epochs/book_pinned_article/*_malha_*.obj
          if-no-files-found: error
          retention-days: 14
      - name: Run tooling Python controls
        shell: bash
        run: python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - name: Audit versioned and built-in research model catalog
        shell: bash
        run: |
          python3 tests/quad/audit_model_catalog.py --root . --report build/local-serial/quad_model_catalog.json
      - name: Retain research model catalog and shared-boundary diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-model-catalog-${{ github.sha }}
          path: build/local-serial/quad_model_catalog.json
          if-no-files-found: error
          retention-days: 14
      - name: Check application M3 mode rejection before TRI globals are touched
        shell: bash
        run: python3 tests/quad/test_m3_dispatch.py build/local-serial/bin/ap_mesh
      - name: Publish native-origin built-in physical hybrid research witnesses
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-m4-real-model-${{ github.sha }}
          path: |
            build/local-serial/m4_real_model/physical_model_hybrid_manifest.json
            build/local-serial/m4_real_model/physical_model_hybrid_*.obj
            build/local-serial/m4_real_model/physical_model_hybrid_*.csv
            build/local-serial/m4_real_model/research_local_delaunay_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish physical four-node QUAD ownership research evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-m4-four-node-ownership-${{ github.sha }}
          path: |
            build/local-serial/m4_quad_ownership/physical_quad_ownership_manifest.json
            build/local-serial/m4_quad_ownership/physical_model_hybrid_*.obj
            build/local-serial/m4_quad_ownership/physical_model_hybrid_*.csv
          if-no-files-found: error
          retention-days: 14
      - name: Publish audited two-patch physical QUAD/TRI research candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-m4-pairwise-physical-${{ github.sha }}
          path: |
            build/local-serial/m4_pairwise_physical/pairwise_physical_manifest.json
            build/local-serial/m4_pairwise_physical/pairwise_*.obj
            build/local-serial/m4_pairwise_physical/pairwise_*.csv
            build/local-serial/m4_pairwise_physical/native_uv_*.csv
          if-no-files-found: error
          retention-days: 14
      - name: Publish real external Bezier per-patch physical diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-m4-external-bezier-${{ github.sha }}
          path: |
            build/local-serial/m4_external_bezier/m4_external_bezier_physical_manifest.json
            build/local-serial/m4_external_bezier/m4_external_bezier_physical_candidates.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish Bezier sheet/curve incidence graph audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quad-m4-sheet-incidence-${{ github.sha }}
          path: |
            build/local-serial/m4_sheet_incidence/m4_sheet_incidence_manifest.json
            build/local-serial/m4_sheet_incidence/sheet_graph_*.json
            build/local-serial/m4_sheet_incidence/sheet_graph_*.dot
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded baseline logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tri-failure-${{ github.sha }}
          path: |
            build/local-serial/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  scientific-tri-compare:
    name: TRI scientific equivalence against frozen baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch full ancestry for strict reference comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable historical reference worktree
        shell: bash
        run: |
          git worktree add --detach ../apmesh-tri-reference f6050ec1b12b508b9d8d761db1fa9a95ab1e3d94
          python3 - <<'PY'
          import subprocess
          allowed = {
              "include/application/runtime_config.h",
              "include/input_output/input_validation.h",
              "src/application/runtime_config.cpp",
              "src/application/run_application.cpp",
              "include/crab_mesh/aft/advancing_front.h",
              "src/crab_mesh/aft/advancing_front.cpp",
              "include/adapter/adapter.h",
              "src/adapter/adapter.cpp",
              "include/generator/generator_adaptive.h",
              "src/generator/generator_adaptive.cpp",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "f6050ec1b12b508b9d8d761db1fa9a95ab1e3d94", "HEAD",
               "--", "src/", "include/", "configs/"],
              text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("Unreviewed production delta: " + ", ".join(sorted(unexpected)))
          print("Reviewed M3 dispatch-only source delta:", sorted(changed))
          PY
          git rev-parse HEAD
          git -C ../apmesh-tri-reference rev-parse HEAD
      - name: Build reference TRI executable using the same compiler and flags
        shell: bash
        run: |
          cmake -S ../apmesh-tri-reference -B ../apmesh-tri-reference/build/science-reference -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DAP_MESH_USE_OPENMP=OFF -DAP_MESH_USE_MPI=OFF -DAP_MESH_ENABLE_LTO=OFF
          cmake --build ../apmesh-tri-reference/build/science-reference --target ap_mesh --parallel 2
      - name: Build candidate TRI executable using the same compiler and flags
        shell: bash
        run: |
          cmake -S . -B build/science-candidate -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DAP_MESH_USE_OPENMP=OFF -DAP_MESH_USE_MPI=OFF -DAP_MESH_ENABLE_LTO=OFF
          cmake --build build/science-candidate --target ap_mesh --parallel 2
          sha256sum ../apmesh-tri-reference/build/science-reference/bin/ap_mesh build/science-candidate/bin/ap_mesh
      - name: Execute fixed Eistute and Book models for both revisions
        shell: bash
        run: |
          for model in eistute book; do
            python3 ../apmesh-tri-reference/tools/run_generation_case.py --exe ../apmesh-tri-reference/build/science-reference/bin/ap_mesh --model "$model" --output "../apmesh-tri-reference/build/science-reference/$model" --timeout 300
            python3 tools/run_generation_case.py --exe build/science-candidate/bin/ap_mesh --model "$model" --output "build/science-candidate/$model" --timeout 300
          done
      - name: Independently audit snapshots and compare all accepted/rejected states
        shell: bash
        run: |
          for model in eistute book; do
            python3 tools/verify_generation.py "build/science-candidate/$model" --baseline "../apmesh-tri-reference/build/science-reference/$model" --require-boundary-coverage --report "build/science-candidate/${model}-comparison.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          for model, expected_states in (("eistute", 5), ("book", 4)):
              result = json.loads((Path("build/science-candidate") / f"{model}-comparison.json").read_text())
              assert result["compared_meshes"] == expected_states, (model, result)
              assert result["all_obj_byte_identical"] is True, (model, result)
              assert result["all_acceptance_fields_equal"] is True, (model, result)
              assert result["boundary_regression"] == "exact", (model, result)
              assert result["boundary_incidence_coverage"] == "verified", (model, result)
          PY
      - name: Copy reference identity receipts into artifact workspace
        if: always()
        shell: bash
        run: |
          if test -f ../apmesh-tri-reference/build/science-reference/eistute/process.json; then
            cp ../apmesh-tri-reference/build/science-reference/eistute/process.json build/science-candidate/reference-eistute-process.json
          fi
          if test -f ../apmesh-tri-reference/build/science-reference/book/process.json; then
            cp ../apmesh-tri-reference/build/science-reference/book/process.json build/science-candidate/reference-book-process.json
          fi
      - name: Retain bounded reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tri-science-${{ github.sha }}
          path: |
            build/science-candidate/*-comparison.json
            build/science-candidate/eistute/process.json
            build/science-candidate/book/process.json
            build/science-candidate/eistute/stderr.log
            build/science-candidate/book/stderr.log
            build/science-candidate/reference-eistute-process.json
            build/science-candidate/reference-book-process.json
          if-no-files-found: ignore
          retention-days: 7
